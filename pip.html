<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FloatTube</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; width: 100vw; height: 100vh; }
#player { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
(function () {
  const p = new URLSearchParams(location.search);
  const v = p.get('v');
  const t = parseInt(p.get('t') || '0', 10);
  if (!v) return;

  const TIME_KEY = 'floattube-pip-time';

  let player = null;
  let ticker  = null;

  // localStorage is shared synchronously across all same-origin contexts,
  // so the main app can read the latest playhead at any moment — no cross-frame
  // object access or channel-timing problems.
  function saveTime() {
    if (!player || !player.getCurrentTime) return;
    try {
      const time = player.getCurrentTime();
      if (typeof time === 'number' && !isNaN(time)) {
        localStorage.setItem(TIME_KEY, String(time));
      }
    } catch (_) {}
  }

  window.onYouTubeIframeAPIReady = function () {
    const vars = { autoplay: 1, rel: 0, playsinline: 1, enablejsapi: 1, origin: location.origin };
    if (t > 1) vars.start = t;

    player = new YT.Player('player', {
      videoId: v,
      playerVars: vars,
      events: {
        onReady: function () {
          saveTime();
          ticker = setInterval(saveTime, 500);
        },
      },
    });
  };

  window.addEventListener('pagehide', function () {
    clearInterval(ticker);
    saveTime();
  });

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
}());
</script>
</body>
</html>
